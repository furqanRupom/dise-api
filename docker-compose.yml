services:
  postgres:
    image: postgres:16
    container_name: dise_db
    restart: always
    environment:
      POSTGRES_USER: diseuser
      POSTGRES_PASSWORD: disepassword
      POSTGRES_DB: disedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dise_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
